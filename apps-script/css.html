<style>
:root{
  --primary:#4F46E5;--accent:#10B981;--danger:#EF4444;--radius:14px;
  --bg:#F5F6FA;--surface:#fff;--surface-2:#EFF1F7;--text:#101828;--muted:#667085;--border:#E4E7EF;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 10px 28px -14px rgba(16,24,40,.14);
  --primary-soft:color-mix(in srgb,var(--primary) 12%,transparent);
  --in:var(--accent);--out:var(--danger);
  --topbar:59px;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
[data-theme=dark]{--bg:#0A0E18;--surface:#121827;--surface-2:#1A2236;--text:#E9EDF7;--muted:#8B97B1;--border:#222B43;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 32px -16px rgba(0,0,0,.7)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h1{font-size:26px;font-weight:800;letter-spacing:-.03em}
.muted,small{color:var(--muted)}small{font-size:12.5px}
.pos{color:var(--in)}.neg{color:var(--out)}

/* Shell: mobile = topbar + tabbar | desktop = sidebar */
.app{min-height:100vh;display:flex;flex-direction:column}
.side{display:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;padding:12px 16px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;min-width:0}
.brand-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:18px 16px 120px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border)}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);background:none;border:0;padding:6px 4px;border-radius:12px;cursor:pointer}
.nav{font-size:10.5px;padding:6px 2px;min-width:0}.nav span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav svg{width:22px;height:22px}.nav.on{color:var(--primary)}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;width:56px;height:56px;border-radius:18px;border:0;background:var(--primary);color:#fff;display:grid;place-items:center;box-shadow:0 12px 24px -8px var(--primary);cursor:pointer}
.fab svg{width:26px;height:26px}
@media(min-width:900px){
  .app{flex-direction:row}
  .top,.tabbar,.fab{display:none}
  .side{display:flex;flex-direction:column;gap:18px;width:256px;flex:none;position:sticky;top:0;height:100vh;padding:22px 14px;background:var(--surface);border-right:1px solid var(--border)}
  .side .brand{flex-direction:column;align-items:center;text-align:center;gap:12px;padding:6px 8px 20px;border-bottom:1px solid var(--border);font-size:17px}
  .side .logo{width:68px;height:68px;border-radius:20px;font-size:28px}
  .side .brand-name{white-space:normal;overflow:visible;line-height:1.25}
  .subnav{display:none}
  .grow-nav{flex:1;display:flex;flex-direction:column;gap:4px}
  .side .nav{flex:none;flex-direction:row;gap:12px;font-size:14px;padding:11px 14px;text-align:left}
  .side .nav:hover{background:var(--surface-2)}.side .nav.on{background:var(--primary-soft)}
  main{padding:36px 44px}
  :root{--topbar:0px}
}

/* Blocos */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{font-size:15px;font-weight:700;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 12px}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi>span{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:500}
.kpi svg{width:15px;height:15px}
.kpi b{font-size:22px;font-weight:800;letter-spacing:-.03em}
.kpi.hero{grid-column:1/-1;border:0;color:#fff;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 55%,#000))}
.kpi.hero>span{color:rgba(255,255,255,.78)}.kpi.hero b{font-size:32px;color:#fff}
.kpi.wide{grid-column:1/-1}
.grid2{display:grid;gap:12px}.grid2>*,.kpi{min-width:0}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}.kpi.hero,.kpi.wide{grid-column:auto}.grid2{grid-template-columns:3fr 2fr}}
.sec-t{font-size:13px;font-weight:700;color:var(--muted);margin:20px 0 8px}

/* Botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:calc(var(--radius) - 3px);border:1px solid var(--border);background:var(--surface);font-weight:600;cursor:pointer;transition:background .15s,filter .15s}
.btn:hover{background:var(--surface-2)}.btn svg{width:18px;height:18px}
.btn.primary{background:var(--primary);border-color:transparent;color:#fff}.btn.primary:hover{filter:brightness(1.1);background:var(--primary)}
.btn.danger{color:var(--danger)}.btn:disabled{opacity:.55;pointer-events:none}
.ib{width:36px;height:36px;border-radius:10px;border:0;background:var(--surface-2);cursor:pointer;display:grid;place-items:center;font-size:18px;flex:none}
.ib svg{width:18px;height:18px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:14px}
input,select{height:46px;padding:0 12px;border-radius:calc(var(--radius) - 4px);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:16px;width:100%}
input:focus,select:focus{outline:3px solid var(--primary-soft);border-color:var(--primary)}
input[type=color]{padding:3px;cursor:pointer}input[type=range]{padding:0;height:28px;accent-color:var(--primary)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;padding:4px;gap:4px;border-radius:calc(var(--radius) - 2px);background:var(--surface-2);margin-bottom:14px}
.seg button{flex:1;height:38px;border:0;border-radius:calc(var(--radius) - 5px);background:none;color:var(--muted);font-weight:600;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center}.row.end{justify-content:flex-end;margin-top:6px}

/* Cabeçalho fixo com ações (Ajustes) e menu de opções */
.head.sticky{position:sticky;top:var(--topbar);z-index:15;background:var(--bg);padding:10px 0;margin:-10px 0 8px;align-items:center}
.head h1{display:flex;align-items:center;gap:10px}
.head-actions{flex:none}.head-actions .ib{width:44px;height:44px}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:200px;z-index:30;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:calc(var(--radius) - 3px);box-shadow:var(--shadow)}
.menu button{display:block;width:100%;text-align:left;padding:12px;border:0;border-radius:10px;background:none;font-weight:600;cursor:pointer}
.menu button:hover{background:var(--surface-2)}

/* Listas */
.mbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);text-transform:capitalize;font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:border-color .15s}
.item:hover{border-color:var(--primary)}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.grow b,.grow small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);flex:none}
.dot svg{width:18px;height:18px}
.chip{font-style:normal;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2)}
.chip.warn{background:color-mix(in srgb,#F59E0B 20%,transparent);color:#B45309}
.bar{height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--c)}
.cat-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:600}.cat-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.busy::after{content:'Carregando…';display:block;text-align:center;color:var(--muted);padding:40px 16px}
.empty,.load{text-align:center;color:var(--muted);padding:40px 16px}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
svg.chart text.v{font-size:11px;font-weight:600}svg.chart text.v.in{fill:var(--in)}svg.chart text.v.out{fill:var(--out)}
.chart-wrap{width:100%;min-width:0}.chart-wrap svg{display:block}

.chk{flex-direction:row;align-items:center;gap:10px;color:var(--text);font-size:15px;font-weight:500;margin:0 0 14px;cursor:pointer}
.chk input{width:20px;height:20px;padding:0;flex:none;accent-color:var(--primary)}
.pend{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.pend:first-of-type{border-top:0}

/* Modal / bottom sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,12,22,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.ov.show{opacity:1}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(32px);transition:transform .25s}
.ov.show .sheet{transform:none}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:18px}
@media(min-width:900px){.ov{align-items:center}.sheet{border-radius:24px;padding-bottom:20px}}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,16px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:600;z-index:99;opacity:0;transition:.3s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{background:var(--danger);color:#fff}

/* Tela de PIN */
.lock{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,var(--primary),color-mix(in srgb,var(--primary) 55%,#000))}
.lock-card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center;padding:28px 22px;background:var(--surface);border-radius:calc(var(--radius) + 8px);box-shadow:var(--shadow)}
.lock-card .logo{width:72px;height:72px;border-radius:22px;font-size:30px;margin:0 auto}
.lock-card h1{font-size:22px}.lock-card label{margin:0;justify-content:center}
.lock-card input[type=password]{text-align:center;letter-spacing:.2em;font-size:20px}
.lock-err{color:var(--danger);font-size:13.5px;font-weight:600}

/* Ajustes */
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.preset{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);border-radius:99px;background:var(--surface);cursor:pointer;font-weight:600;font-size:13px}
.preset i{width:16px;height:16px;border-radius:50%;display:block}.preset i+i{margin-left:-12px;border:2px solid var(--surface)}
.logo-edit{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.logo-edit .logo{width:56px;height:56px;border-radius:16px;font-size:22px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
